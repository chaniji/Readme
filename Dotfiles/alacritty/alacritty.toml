[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "JetBrainsMono  Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 10.5



[window]
padding.x = 20
padding.y = 20
decorations = "None"
startup_mode = "Windowed"
dimensions.columns = 160
dimensions.lines = 42
position.x = 260
position.y = 110

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
{ key = "Return", mods = "Shift", chars = "\u001B\r" }
]
[colors.primary]
background = "#282828"
foreground = "#d4be98"

[colors.cursor]
text = "#282828"
cursor = "#bdae93"

[colors.vi_mode_cursor]
text = "#282828"
cursor = "#bdae93"

[colors.search.matches]
foreground = "#282828"
background = "#d8a657"

[colors.search.focused_match]
foreground = "#282828"
background = "#ea6962"

[colors.footer_bar]
foreground = "#282828"
background = "#d4be98"

[colors.selection]
text = "#ebdbb2"
background = "#d65d0e"

[colors.normal]
black = "#3c3836"
red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
blue = "#7daea3"
magenta = "#d3869b"
cyan = "#89b482"
white = "#d4be98"

[colors.bright]
black = "#3c3836"
red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
blue = "#7daea3"
magenta = "#d3869b"
cyan = "#89b482"
white = "#d4be98"
