# yaml-language-server: $schema=https://json.schemastore.org/lazydocker.json
#
# Gruvbox theme for lazydocker
# Place at: ~/.config/jesseduffield/lazydocker/config.yml

gui:
  border: rounded
  theme:
    activeBorderColor:
      - yellow    # gruvbox bright yellow #fabd2f
      - bold
    inactiveBorderColor:
      - white     # gruvbox fg #ebdbb2
    selectedLineBgColor:
      - blue      # gruvbox bright blue #83a598
    optionsTextColor:
      - cyan      # gruvbox aqua #8ec07c

stats:
  graphs:
    - caption: CPU (%)
      statPath: DerivedStats.CPUPercentage
      color: yellow     # gruvbox yellow
    - caption: Memory (%)
      statPath: DerivedStats.MemoryPercentage
      color: green      # gruvbox green
