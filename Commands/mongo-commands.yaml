# MongoDB Command Reference (mongosh)
# View with: bat mongo-commands.yaml

connection_and_navigation:
  - command: "mongosh \"mongodb://localhost:27017\""
    description: "Connect to a local MongoDB instance."
  - command: "show dbs"
    description: "List all available databases."
  - command: "use <db_name>"
    description: "Switch context to a specific database (creates it if it doesn't exist)."
  - command: "db"
    description: "Display the name of the current database."
  - command: "show collections"
    description: "List all collections in the current database."
  - command: "cls"
    description: "Clear the terminal screen."
  - command: "exit"
    description: "Exit the MongoDB shell."

crud_operations:
  - command: "db.collection.insertOne({ key: 'value' })"
    description: "Insert a single document into a collection."
  - command: "db.collection.insertMany([{ k1: 'v1' }, { k2: 'v2' }])"
    description: "Insert multiple documents into a collection."
  - command: "db.collection.find()"
    description: "Retrieve all documents from a collection."
  - command: "db.collection.findOne({ _id: ObjectId('...') })"
    description: "Find a single document by its ID."
  - command: "db.collection.updateOne({ filter }, { $set: { key: 'new_value' } })"
    description: "Update the first document that matches the filter."
  - command: "db.collection.updateMany({ filter }, { $inc: { count: 1 } })"
    description: "Update all documents that match the filter (e.g., increment a field)."
  - command: "db.collection.deleteOne({ filter })"
    description: "Remove the first document that matches the filter."
  - command: "db.collection.deleteMany({ filter })"
    description: "Remove all documents that match the filter."

database_and_collection_mgmt:
  - command: "db.createCollection('name')"
    description: "Explicitly create a new collection."
  - command: "db.collection.drop()"
    description: "Remove an entire collection and its documents."
  - command: "db.dropDatabase()"
    description: "Delete the current database and all its data."

indexes_and_aggregation:
  - command: "db.collection.createIndex({ field: 1 }, { unique: true })"
    description: "Create an index on a field (1 for ascending, -1 for descending)."
  - command: "db.collection.getIndexes()"
    description: "List all indexes on a collection."
  - command: "db.collection.aggregate([{ $match: { ... } }, { $group: { ... } }])"
    description: "Perform complex data processing using the aggregation pipeline."

utility_and_status:
  - command: "db.stats()"
    description: "Get storage statistics for the current database."
  - command: "db.collection.stats()"
    description: "Get detailed statistics for a specific collection."
  - command: "db.hello()"
    description: "Check the status and role of the connected MongoDB instance."
  - command: "db.serverStatus()"
    description: "Returns a document that provides an overview of the database's state."
